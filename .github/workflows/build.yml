name: Build, Test and Release

on:
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    paths-ignore:
    - CHANGELOG.md

  push:
    branches:
    - main
    paths-ignore:
    - CHANGELOG.md
    - .github/**
    tags: [v*]

env:
  buildFolderName: output
  buildArtifactName: output
  testResultFolderName: testResults
  requiredPowerShellVersion: 7.6.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Install PowerShell
      uses: PSModule/install-powershell@fae856952e6df680db7429f86b026c8741ff666d # v1.1.0
      with:
        Version: ${{ env.requiredPowerShellVersion }}

    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '6.3.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        configFilePath: GitVersion.yml

    - name: Setup assets cache
      id: assetscache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: output/RequiredModules
        key: ${{ hashFiles('RequiredModules.psd1') }}

    - name: Download required dependencies
      if: steps.assetscache.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build.ps1 -ResolveDependency -Task noop

    # Remove the last dot in semVer, for Sampler validation in pre-release
    - name: Format semVer for Sampler
      id: formatSemVer
      shell: pwsh
      run: |
        $SemVer = '${{ steps.gitversion.outputs.semVer }}'
        # Remove last dot for Sampler to accept as pre-release; dots are not allowed in pre-release names
        $SemVer = $SemVer -replace '^([\d\.]+\-\w+)\.(\d+)$','$1$2'
        Add-Content -Path $env:GITHUB_OUTPUT -Value "formattedSemVer=$SemVer"

    - name: Build module
      shell: pwsh
      run: ./build.ps1 -tasks pack
      env:
        ModuleVersion: ${{ steps.formatSemVer.outputs.formattedSemVer }}

    - name: Publish build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.buildArtifactName }}
        path: ${{ env.buildFolderName }}/

  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
    - build
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Windows
          os: windows-latest
    steps:
    - name: Install PowerShell
      uses: PSModule/install-powershell@fae856952e6df680db7429f86b026c8741ff666d # v1.1.0
      with:
        Version: ${{ env.requiredPowerShellVersion }}
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
    - name: Download Build Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ env.buildArtifactName }}
        path: ${{ env.buildFolderName }}

    - name: Run Tests
      shell: pwsh
      run: ./build.ps1 -tasks test

    - name: Publish Test Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        path: ${{ env.buildFolderName }}/${{ env.testResultFolderName }}/
        name: CodeCoverage-${{ matrix.name }}
      if: success() || failure()

  code-coverage:
    name: Publish Code Coverage
    permissions:
      checks: write
      pull-requests: write
    if: success() || failure()
    runs-on: ubuntu-latest
    needs:
    - build
    - test
    steps:
    - name: Download Test Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: CodeCoverage-*
        path: ${{ env.buildFolderName }}/${{ env.testResultFolderName }}

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
      if: always()
      with:
        files: ${{ env.buildFolderName }}/${{ env.testResultFolderName }}/CodeCoverage-*/NUnit*.xml
        check_name: Test Results

  release:
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
    - build
    - test
    - code-coverage
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Install PowerShell
      uses: PSModule/install-powershell@fae856952e6df680db7429f86b026c8741ff666d # v1.1.0
      with:
        Version: ${{ env.requiredPowerShellVersion }}
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
    
    - name: Download Build Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ env.buildArtifactName }}
        path: ${{ env.buildFolderName }}

    - name: Publish Release
      shell: pwsh
      run: Import-Module ./output/RequiredModules/PowerShellForGitHub; ./build.ps1 -tasks publish
      env:
        GitHubToken: ${{ secrets.GITHUB_TOKEN }}
        GalleryApiToken: ${{ secrets.BICEP_PSGALLERY_KEY }}

    - name: Send Changelog PR
      shell: pwsh
      run: ./build.ps1 -tasks Create_ChangeLog_GitHub_PR
      env:
        GitHubToken: ${{ secrets.GITHUB_TOKEN }}
